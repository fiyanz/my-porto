services:
  # ------------------------------------
  # 1. Backend (FastAPI - Docker)
  # ------------------------------------
  - type: web
    name: my-porto-bta9
    env: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    plan: free # Use free tier
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard with Supabase URL
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: GITHUB_TOKEN
        sync: false # Set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false

  # ------------------------------------
  # 2. Frontend (Next.js - Hosted on Vercel: https://fiyanz.my.id)
  # ------------------------------------
  # Note: Frontend is managed on Vercel. Keep Render config if running Docker fallback.
  - type: web
    name: portofolio-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://my-porto-bta9.onrender.com
