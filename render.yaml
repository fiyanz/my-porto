services:
  # ------------------------------------
  # 1. Backend (FastAPI)
  # ------------------------------------
  - type: web
    name: portofolio-backend
    env: python
    rootDir: ./server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free # Use free tier
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard with Supabase URL
      - key: SECRET_KEY
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false # You must set this manually in Render dashboard

  # ------------------------------------
  # 2. Frontend (Next.js)
  # ------------------------------------
  - type: web
    name: portofolio-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        # In production, frontend will talk directly to the backend's Render URL
        # instead of going through Nginx.
        # Format is usually https://<backend-name>.onrender.com
        value: https://portofolio-backend.onrender.com
